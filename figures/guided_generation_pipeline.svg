<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1710" height="935" viewBox="125 65 1710 935" role="img"
     aria-labelledby="title desc">
  <title id="title">VLM-guided latent diffusion pipeline</title>
  <desc id="desc">A starting Gaussian latent is partially denoised to an early latent. A differentiable rollout is scored by a vision-language model. Its gradient updates the early latent, and generation is repeated with cached DDPM noise.</desc>

  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfcfe"/>
      <stop offset="1" stop-color="#f4f7fb"/>
    </linearGradient>
    <linearGradient id="blueFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf5ff"/>
      <stop offset="1" stop-color="#e3efff"/>
    </linearGradient>
    <linearGradient id="violetFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4efff"/>
      <stop offset="1" stop-color="#ebe3ff"/>
    </linearGradient>
    <linearGradient id="greenFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#effbf6"/>
      <stop offset="1" stop-color="#e3f7ee"/>
    </linearGradient>
    <linearGradient id="orangeFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8e9"/>
      <stop offset="1" stop-color="#fff0cc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1b2740" flood-opacity=".10"/>
    </filter>
    <filter id="noise" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".78" numOctaves="3" seed="67"/>
      <feColorMatrix values=".75 0 0 0 .1  0 .85 0 0 .12  0 0 1 0 .18  0 0 0 1 0"/>
    </filter>
    <clipPath id="finalClip">
      <rect x="1068" y="628" width="285" height="285" rx="16"/>
    </clipPath>
    <clipPath id="candidateClip">
      <rect x="1068" y="238" width="285" height="285" rx="16"/>
    </clipPath>
    <clipPath id="noiseClip">
      <rect x="95" y="237" width="142" height="142" rx="13"/>
    </clipPath>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#35445f"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#2f6feb"/>
    </marker>
    <marker id="arrowViolet" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#7457d9"/>
    </marker>
    <style>
      .sans { font-family: Inter, "Helvetica Neue", Arial, sans-serif; }
      .math { font-family: "STIX Two Math", "Times New Roman", serif; }
      .ink { fill: #182235; }
      .muted { fill: #667085; }
      .cell-title { font-family: Inter, "Helvetica Neue", Arial, sans-serif; font-size: 18px; font-weight: 650; font-style: normal; }
      .axis-title { font-family: Inter, "Helvetica Neue", Arial, sans-serif; font-size: 24px; font-weight: 650; font-style: normal; }
      .body-text { font-family: Inter, "Helvetica Neue", Arial, sans-serif; font-size: 17px; font-weight: 400; font-style: normal; }
      .prompt-text { font-size: 24px; }
      .formula { font-family: "STIX Two Math", "Times New Roman", serif; font-size: 24px; font-weight: 400; font-style: normal; }
      .formula-label { font-family: "STIX Two Math", "Times New Roman", serif; font-size: 25px; font-weight: 400; font-style: italic; }
      .symbol { font-family: "STIX Two Math", "Times New Roman", serif; font-size: 38px; font-weight: 400; font-style: italic; }
      .node { stroke-width: 1.5; filter: url(#shadow); }
      .flow { fill: none; stroke: #35445f; stroke-width: 3; marker-end: url(#arrow); }
      .blueFlow { fill: none; stroke: #2f6feb; stroke-width: 3.5; marker-end: url(#arrowBlue); }
      .violetFlow { fill: none; stroke: #7457d9; stroke-width: 3.5; marker-end: url(#arrowViolet); }
      .dashed { stroke-dasharray: 9 8; }
    </style>
  </defs>

  <rect width="1900" height="1000" fill="url(#page)"/>

  <!-- Text condition -->
  <g>
    <rect x="170" y="110" width="520" height="56" rx="18"
          fill="#ffffff" stroke="#c9d2df" class="node"/>
    <text x="430" y="146" text-anchor="middle" class="body-text prompt-text ink">
      <tspan font-weight="650">Prompt:</tspan>
      <tspan> “A chef prepares a painting.”</tspan>
    </text>
  </g>

  <!-- Start latent -->
  <g>
    <rect x="170" y="304" width="130" height="112" rx="22" fill="#eef1f6" stroke="#aeb9c9" class="node"/>
    <text x="235" y="372" text-anchor="middle" class="symbol ink">X<tspan baseline-shift="sub" font-size="23">0</tspan></text>
  </g>

  <!-- Partial denoise visual -->
  <path d="M314 360 H376" class="flow"/>
  <!-- Early latent -->
  <g>
    <rect x="390" y="304" width="130" height="112" rx="22" fill="url(#blueFill)" stroke="#84aef5" class="node"/>
    <text x="455" y="372" text-anchor="middle" class="symbol ink">X<tspan baseline-shift="sub" font-size="23">t</tspan></text>
  </g>

  <!-- Differentiable rollout -->
  <path d="M520 360 H701" class="flow"/>
  <g>
    <rect x="715" y="304" width="130" height="112" rx="22" fill="#eef1f6" stroke="#aeb9c9" class="node"/>
    <text x="780" y="372" text-anchor="middle" class="symbol ink">X<tspan baseline-shift="sub" font-size="23">50</tspan></text>
  </g>

  <!-- Candidate image icon -->
  <path d="M845 360 H1036" class="flow"/>
  <g>
    <rect x="1050" y="220" width="321" height="345" rx="24" fill="#fff" stroke="#cbd4e1" class="node"/>
    <image x="1068" y="238" width="285" height="285" preserveAspectRatio="xMidYMid slice"
           clip-path="url(#candidateClip)"
           xlink:href="candidate_image_before_guidance.png"/>
    <rect x="1068" y="238" width="285" height="285" rx="16" fill="none" stroke="#d5dce8"/>
    <text x="1211" y="550" text-anchor="middle" class="formula-label ink">I<tspan baseline-shift="sub" font-size="16">vanilla</tspan></text>
  </g>

  <!-- VLM -->
  <path d="M1385 360 H1416" class="violetFlow"/>
  <g>
    <rect x="1430" y="272" width="360" height="176" rx="24" fill="url(#violetFill)" stroke="#a893ee" class="node"/>
    <text x="1456" y="326" class="cell-title ink">VLM loss</text>
    <text x="1456" y="370" class="body-text ink">“Does the image shows exactly {prompt}”</text>
    <text x="1456" y="414" class="formula ink">
      ℒ<tspan baseline-shift="sub" font-size="15">VLM</tspan> = softplus[−(p<tspan baseline-shift="sub" font-size="15">yes</tspan> − p<tspan baseline-shift="sub" font-size="15">no</tspan>)]
    </text>
  </g>

  <!-- Gradient return and update -->
  <path d="M1570 448 C1550 585 1110 610 900 570 C680 532 600 466 520 416"
        class="violetFlow dashed"/>
  <rect x="760" y="520" width="210" height="48" rx="24" fill="#f7f3ff" stroke="#baaaf0"/>
  <text x="865" y="551" text-anchor="middle" class="formula ink">
    ∇<tspan baseline-shift="sub" font-size="14">X<tspan baseline-shift="sub" font-size="10">t</tspan></tspan> ℒ<tspan baseline-shift="sub" font-size="14">VLM</tspan>
  </text>

  <g>
    <rect x="290" y="650" width="330" height="130" rx="22" fill="url(#orangeFill)" stroke="#e7bd62" class="node"/>
    <text x="316" y="690" class="cell-title" fill="#986400">Latent update</text>
    <text x="455" y="741" text-anchor="middle" class="formula ink">
      X′<tspan baseline-shift="sub" font-size="18">t</tspan> = X<tspan baseline-shift="sub" font-size="18">t</tspan> − η ∇<tspan baseline-shift="sub" font-size="18">X<tspan baseline-shift="sub" font-size="13">t</tspan></tspan> ℒ<tspan baseline-shift="sub" font-size="18">VLM</tspan>
    </text>
  </g>
  <path d="M455 416 V636" class="violetFlow"/>

  <!-- Updated rollout -->
  <path d="M620 715 H676" class="blueFlow"/>
  <g>
    <rect x="690" y="630" width="300" height="180" rx="22" fill="url(#greenFill)" stroke="#75c79f" class="node"/>
    <text x="717" y="672" class="cell-title" fill="#15734c">Regenerate</text>
    <text x="717" y="718" class="formula ink">Denoise X′<tspan baseline-shift="sub" font-size="15">t</tspan> → X<tspan baseline-shift="sub" font-size="15">50</tspan></text>
    <g transform="translate(717 765)">
      <rect width="24" height="24" rx="6" fill="#2f9d70"/>
      <path d="M6 12 L10 16 L18 7" fill="none" stroke="#fff" stroke-width="2.5"/>
      <text x="35" y="18" class="body-text" fill="#15734c">cached DDPM noise ε<tspan baseline-shift="sub" font-size="12">t</tspan></text>
    </g>
  </g>

  <!-- Final image -->
  <path d="M990 720 H1036" class="blueFlow"/>
  <g>
    <rect x="1050" y="610" width="321" height="345" rx="24" fill="#fff" stroke="#6e99e7" class="node"/>
    <image x="1068" y="628" width="285" height="285" preserveAspectRatio="xMidYMid slice"
           clip-path="url(#finalClip)"
           xlink:href="guided_output_example.png"/>
    <rect x="1068" y="628" width="285" height="285" rx="16" fill="none" stroke="#d5dce8"/>
    <text x="1211" y="940" text-anchor="middle" class="formula-label ink">I<tspan baseline-shift="sub" font-size="16">guided</tspan></text>
  </g>

</svg>
